name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.5"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_CMDLINE_TOOLS_VERSION: "12266719"

jobs:
  build-debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/android-sdk-install.log"
          report_error() {
            STATUS=$?
            if [[ $STATUS -ne 0 ]]; then
              {
                echo '## Échec installation Android SDK'
                echo '```text'
                tail -n 100 "$LOG" 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trap report_error EXIT
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          TOOLS_ZIP="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip" \
            --output "$TOOLS_ZIP"
          UNPACK_DIR="$RUNNER_TEMP/android-commandline-tools"
          mkdir -p "$UNPACK_DIR"
          unzip -q "$TOOLS_ZIP" -d "$UNPACK_DIR"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R "$UNPACK_DIR/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          {
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platform-tools" \
              "platforms;android-${ANDROID_API_LEVEL}" \
              "build-tools;${ANDROID_BUILD_TOOLS}"
          } 2>&1 | tee "$LOG"
          trap - EXIT

      - name: Restore a valid Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/gradle-wrapper.log"
          report_error() {
            STATUS=$?
            if [[ $STATUS -ne 0 ]]; then
              {
                echo '## Échec initialisation Gradle'
                echo '```text'
                tail -n 120 "$LOG" 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trap report_error EXIT
          BOOTSTRAP_DIR="$RUNNER_TEMP/gradle-wrapper-bootstrap"
          mkdir -p "$BOOTSTRAP_DIR"
          {
            gradle -p "$BOOTSTRAP_DIR" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin \
              --no-daemon
            cp "$BOOTSTRAP_DIR/gradlew" ./gradlew
            cp "$BOOTSTRAP_DIR/gradlew.bat" ./gradlew.bat
            mkdir -p gradle/wrapper
            cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
            chmod +x ./gradlew
            ./gradlew --version --no-daemon
          } 2>&1 | tee "$LOG"
          trap - EXIT

      - name: Run available unit tests
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/unit-tests.log"
          report_error() {
            STATUS=$?
            if [[ $STATUS -ne 0 ]]; then
              {
                echo '## Échec configuration Gradle ou tests unitaires'
                echo '```text'
                tail -n 180 "$LOG" 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trap report_error EXIT
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$LOG"
          trap - EXIT

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/assemble-debug.log"
          report_error() {
            STATUS=$?
            if [[ $STATUS -ne 0 ]]; then
              {
                echo '## Échec compilation APK debug'
                echo '```text'
                tail -n 180 "$LOG" 2>/dev/null || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trap report_error EXIT
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$LOG"
          trap - EXIT

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK absent ou vide: $APK"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          {
            echo "## APK debug vérifié"
            echo "- Fichier: \`app-debug.apk\`"
            echo "- Taille: \`${APK_SIZE}\` octets"
            echo "- SHA-256: \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$APK"
          echo "SIZE=$APK_SIZE"
          echo "SHA256=$APK_SHA256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eternia-ai-rpg-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
