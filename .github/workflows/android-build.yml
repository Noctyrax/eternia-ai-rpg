name: Android Build & Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "34"
  BUILD_TOOLS_VERSION: "34.0.0"
  NDK_VERSION: "r26c"

jobs:
  # Pre-check: Validate Gradle wrapper and project structure
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew not found"
            exit 1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::gradle-wrapper.properties not found"
            exit 1
          fi
          echo "Gradle wrapper validated"

      - name: Validate project structure
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          if [ ! -f build.gradle.kts ]; then
            echo "::error::build.gradle.kts not found"
            exit 1
          fi
          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::app/src/main/AndroidManifest.xml not found"
            exit 1
          fi
          echo "Project structure validated"

  # Lint and static analysis
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon --stacktrace
        continue-on-error: true

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt*.html
          retention-days: 7

  # Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace --continue

      - name: Upload Test Reports
        uses: actions/upload_artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**/*
            **/build/test-results/**/*
          retention-days: 7

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/**/*
          retention-days: 7

  # Build Debug APK
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK not found at $APK_PATH"
            find . -name "*.apk" -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Build Release APK (only on main branch and tags)
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.NDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create Keystore from Secrets
        if: env.KEYSTORE_BASE64 != ''
        id: create_keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Release APK exists
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            find . -name "*.apk" -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "Release APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "RELEASE_APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # Create GitHub Release (only on tags)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "ETERNIA AI RPG ${{ github.ref_name }}"
          body: |
            ## ETERNIA AI RPG ${{ github.ref_name }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Download
            - [app-release.apk](release/app-release.apk)
            
            ### Installation
            1. Enable "Install unknown apps" for your browser/file manager
            2. Download the APK
            3. Open the APK file to install
            
            ### Requirements
            - Android 8.0 (API 26) or higher
            - Internet permission for AI providers
            - Storage permission for imports/exports
            - Microphone permission for voice input (optional)
          files: |
            release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency Check (security)
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run Dependency Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            **/build/reports/dependency-check/**/*
          retention-days: 7

  # Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-debug, build-release, dependency-check]
    if: always()
    steps:
      - name: Print Build Summary
        run: |
          echo "=== ETERNIA AI RPG Build Summary ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Jobs:"
          echo "  - validate: ${{ needs.validate.result }}"
          echo "  - lint: ${{ needs.lint.result }}"
          echo "  - test: ${{ needs.test.result }}"
          echo "  - build-debug: ${{ needs.build-debug.result }}"
          echo "  - build-release: ${{ needs.build-release.result }}"
          echo "  - dependency-check: ${{ needs.dependency-check.result }}"
          echo ""
          if [ "${{ needs.build-debug.result }}" == "success" ]; then
            echo "✅ Debug APK: Successfully built"
            echo "   Size: ${{ env.APK_SIZE }} bytes"
          else
            echo "❌ Debug APK: Build failed"
          fi
          echo ""
          if [ "${{ needs.build-release.result }}" == "success" ]; then
            echo "✅ Release APK: Successfully built"
            echo "   Size: ${{ env.RELEASE_APK_SIZE }} bytes"
          else
            echo "⚠️ Release APK: Not built (only on main/tags)"
          fi
          echo ""
          echo "Artifacts available for download in Actions tab"