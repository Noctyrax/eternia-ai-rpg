name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.5"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Restore a valid Gradle wrapper
        run: |
          set -euo pipefail
          BOOTSTRAP_DIR="$RUNNER_TEMP/gradle-wrapper-bootstrap"
          mkdir -p "$BOOTSTRAP_DIR"
          gradle -p "$BOOTSTRAP_DIR" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin \
            --no-daemon
          cp "$BOOTSTRAP_DIR/gradlew" ./gradlew
          cp "$BOOTSTRAP_DIR/gradlew.bat" ./gradlew.bat
          mkdir -p gradle/wrapper
          cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Run available unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK absent ou vide: $APK"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          {
            echo "## APK debug vérifié"
            echo "- Fichier: \`app-debug.apk\`"
            echo "- Taille: \`${APK_SIZE}\` octets"
            echo "- SHA-256: \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$APK"
          echo "SIZE=$APK_SIZE"
          echo "SHA256=$APK_SHA256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eternia-ai-rpg-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
